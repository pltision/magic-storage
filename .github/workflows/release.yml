name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Joml annotation
        run: ./gradlew :processor:generateJoml --no-daemon

      - name: Build and test
        run: ./gradlew build --no-daemon -PreleaseVersion=${GITHUB_REF_NAME#v}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            processor/build/libs/*.jar
            build/libs/*.jar
          generate_release_notes: true
