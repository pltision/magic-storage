plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'yee.pltision'
version = project.findProperty('releaseVersion') ?: '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // 生成代码
    implementation 'com.palantir.javapoet:javapoet:0.17.0'

    // 可选的Accessor
    implementation "org.joml:joml:${jomlVersion}"

    compileOnly "org.jetbrains:annotations:${annotationsVersion}"

    // 字符串处理，不会传递依赖
    implementation 'cn.hutool:hutool-all:5.8.47'

}

// 生成 yee.pltision.magicstorage.annotation.Joml（该文件在 .gitignore 中，构建前需重新生成）
tasks.register('generateJoml', JavaExec) {
    group = 'build'
    description = 'Runs JomlGlueGenerator to (re)generate yee.pltision.magicstorage.annotation.Joml'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'yee.pltision.magicstorage.joml.JomlGlueGenerator'
    workingDir = rootDir
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'processor'
        }
    }
}